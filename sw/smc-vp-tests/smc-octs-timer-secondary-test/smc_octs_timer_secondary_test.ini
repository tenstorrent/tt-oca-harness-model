# ----------------------------------------------------------------------------------------- #
# smc-vp CCI config for the octs_system_timer SECONDARY-mode test.
#
# Identical to vp/platform/smc/config/smc_platform_vp.ini, plus it flips the
# timer's is_primary_i strap to 0 so STATUS.MODE reads SECONDARY (see the
# octs_is_primary cci_param declaration in vp/platform/smc/smc_platform.hpp).
# The silicon default is PRIMARY, which smc-octs-timer-test covers.
# ----------------------------------------------------------------------------------------- #

[bool]
dut.trace : false

# Strap the OCTS timer as a SECONDARY.  Nothing in the SMC VP drives its
# sync_load input, so it stays parked -- which is exactly what this test checks.
dut.octs_is_primary : false

[int]
dut.log_verbosity : 7

[uint]
dut.cluster.num_harts : 4
dut.cluster.fast_mem_lo : 0x80000000
dut.cluster.fast_mem_hi : 0x90000000
dut.cluster.mmio_lo     : 0xC0000000
dut.cluster.mmio_hi     : 0xC1000000
dut.cluster.source_id   : 0x10

dut.bootrom.size_bytes        : 0x20000
dut.scratchpad_ram.size_bytes : 0x100000
dut.plic.num_sources          : 336
dut.plic.num_contexts         : 8
dut.clint.num_harts           : 4
dut.reset_unit.num_subsystems : 32

dut.cpu_ctrl.base_addr        : 0xC0400000

[string]
dut.bootrom.init_file       :
dut.bootrom.init_file_format : auto
