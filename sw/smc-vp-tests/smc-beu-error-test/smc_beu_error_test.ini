# ----------------------------------------------------------------------------------------- #
# smc-vp CCI config for the BEU error-injection test (Phase E2/E3).
#
# Identical to vp/platform/smc/config/smc_platform_vp.ini, plus it enables the
# platform's test-only BEU error-injection hook (Phase D1; see
# smc/peripherals/beu/doc/04_BEU_Platform_Integration_Test_Plan.md and the
# beu_inject* cci_param declarations in vp/platform/smc/smc_platform.hpp).
# Every injection happens at elaboration (before sc_start()), so it is already
# latched into ACCRUED/CAUSE/PHYS_ADDR by the time firmware boots:
#
#   #0: BEU0 <- DCACHE_UNCORRECTABLE (src=7) @ 0x1000_2000   (first error on core 0)
#   #1: BEU0 <- DCACHE_TLBUS         (src=5) @ 0x3000_4000   (second error on core 0;
#                                                              CAUSE must hold #0's value)
#   #2: BEU1 <- ICACHE_TLBUS         (src=1) @ 0x5000_6000   (isolation: BEU2/BEU3 untouched)
# ----------------------------------------------------------------------------------------- #

[bool]
dut.trace : false

# Test-only BEU error injection (Phase D1) -- see header comment above.
dut.beu_inject0_enable : true
dut.beu_inject1_enable : true
dut.beu_inject2_enable : true

[int]
dut.log_verbosity : 7

[uint]
dut.cluster.num_harts : 4
dut.cluster.fast_mem_lo : 0x80000000
dut.cluster.fast_mem_hi : 0x90000000
dut.cluster.mmio_lo     : 0xC0000000
dut.cluster.mmio_hi     : 0xC1000000
dut.cluster.source_id   : 0x10

dut.bootrom.size_bytes        : 0x20000
dut.scratchpad_ram.size_bytes : 0x100000
dut.plic.num_sources          : 336
dut.plic.num_contexts         : 8
dut.clint.num_harts           : 4
dut.reset_unit.num_subsystems : 32

dut.cpu_ctrl.base_addr        : 0xC0039000
dut.dma.base_addr             : 0xC0038000
dut.dma.max_burst_bytes       : 8

# Injection #0: BEU0, DCACHE_UNCORRECTABLE (bit 7), addr 0x1000_2000.
dut.beu_inject0_core : 0
dut.beu_inject0_src  : 7
dut.beu_inject0_addr : 0x10002000

# Injection #1: BEU0, DCACHE_TLBUS (bit 5), addr 0x3000_4000 -- second source
# on the SAME core; CAUSE must still read 7 (holds the first latch).
dut.beu_inject1_core : 0
dut.beu_inject1_src  : 5
dut.beu_inject1_addr : 0x30004000

# Injection #2: BEU1, ICACHE_TLBUS (bit 1), addr 0x5000_6000 -- BEU2/BEU3 get
# no injection at all (per-core isolation check).
dut.beu_inject2_core : 1
dut.beu_inject2_src  : 1
dut.beu_inject2_addr : 0x50006000

[string]
dut.bootrom.init_file       :
dut.bootrom.init_file_format : auto
