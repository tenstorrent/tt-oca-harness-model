# ----------------------------------------------------------------------------------------- #
# smc-vp CCI configuration for Zephyr on the SMC virtual platform.
#
# Differs from vp/platform/smc/config/smc_platform_vp.ini in one essential
# way: CLINT mtime ticks.  The default VP ini freezes mtime (tick_period_ns=0)
# so the bare-metal firmware tests stay deterministic.  Zephyr's scheduler
# needs a live machine timer.
#
# 10000 ns/tick = 100 kHz, matching CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000
# in the smc_vp board defconfig.
# ----------------------------------------------------------------------------------------- #

[bool]
dut.trace : false

[int]
dut.log_verbosity : 5

[uint]
dut.cluster.num_harts : 4
dut.cluster.fast_mem_lo : 0x80000000
dut.cluster.fast_mem_hi : 0x90000000
dut.cluster.mmio_lo     : 0xC0000000
dut.cluster.mmio_hi     : 0xC1000000
dut.cluster.source_id   : 0x10

dut.bootrom.size_bytes        : 0x20000
dut.scratchpad_ram.size_bytes : 0x100000
dut.plic.num_sources          : 336
dut.plic.num_contexts         : 8
dut.clint.num_harts           : 4
dut.reset_unit.num_subsystems : 32

dut.cpu_ctrl.base_addr        : 0xC0039000
dut.dma.base_addr             : 0xC0038000
dut.dma.max_burst_bytes       : 8

[double]
# 10 µs / tick → 100 kHz mtime.  Do not set this to 0: Zephyr will hang
# waiting for the first machine-timer interrupt.
dut.clint.tick_period_ns : 10000.0

[string]
dut.bootrom.init_file        :
dut.bootrom.init_file_format : auto
