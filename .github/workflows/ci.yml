# CI for tt-oca-sim (Open Chiplet Atlas Virtual Platform)
#
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
#  build-deps      Build + cache SystemC 3.0.2 and CCI 1.0.2 from source.
#                  Cache key includes OS + compiler + C++ standard, so
#                  subsequent runs skip the build entirely.
#                  CCI 1.0.2 is built with CMake; it bundles RapidJSON so no
#                  separate clone is needed.  The cci_value_iterator C++20
#                  regression present in 1.0.1 is fixed in 1.0.2.
#
#  sep-vp          Build the sep-vp executable (needs build-deps cache).
#
#  sep-unit-tests  Run every SEP peripheral unit test via
#                  sep/peripherals/run_all_peripherals.sh (needs build-deps).
#
#  smc-unit-tests  Run every SMC peripheral unit test via each
#                  smc/peripherals/<ip>/run_tests.sh (needs build-deps).
#                  Includes the new DMA and PVT wrapper peripheral unit tests.
#                  The cpu_cluster is skipped — it requires the Tenstorrent-
#                  internal Whisper ISS (WHISPER_HOME); enable it locally once
#                  WHISPER_HOME is available.
#
#  smc-fabric-tests  Build and run the SMC Fabric SystemC/TLM-2.0 testbench
#                    via smc/smc_fabric/run_tests.sh (needs build-deps).
#
#  smc-vp            Build the smc-vp executable (needs build-deps + Whisper ISS
#                    + RISC-V bare-metal toolchain).  Runs the smc-vp-tests
#                    firmware suite via sw/smc-vp-tests/run_smc_vp_tests.sh,
#                    including the new smc-dma-test and smc-pvt-wrap-test.
#                    Then runs Zephyr hello_world + mmio_poke via
#                    sw/zephyr-smc/zephyr_smc.sh ci (west workspace is cached).
#
#  smu-unit-tests    SMU interconnect unit tests (smu_axi_xbar + axi_window_remap)
#                    via vp/platform/smu/run_tests.sh (Release + ASAN + Coverage).
#
#  smu-vp            Build smu-vp and run SMU VP firmware tests
#                    (sw/smu-vp-tests/run_smu_vp_tests.sh).  Needs Whisper built
#                    -fPIC (linked into libsmc_cluster_smu.so) plus a dual-width
#                    RISC-V toolchain (RV64 SMC + RV32 SEP).
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  SYSTEMC_VERSION: "3.0.2"
  CCI_VERSION:     "1.0.2"
  WHISPER_REV:     "a53d0f3e"  # tenstorrent/whisper commit the SMC VP was validated against
  RISCV_XPACK_VERSION: "15.2.0-1"
  ZEPHYR_VERSION:  "v4.3.0"
  SYSTEMC_HOME:    /home/runner/local/systemc-3.0.2
  CCI_HOME:        /home/runner/local/cci-1.0.2
  CXX_STD:         "20"

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — build and cache SystemC + CCI
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-deps:
    name: Build SystemC + CCI
    runs-on: ubuntu-22.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ make autoconf cmake

      # ── SystemC ────────────────────────────────────────────────────────────
      - name: Cache SystemC ${{ env.SYSTEMC_VERSION }}
        id: cache-sc
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Build SystemC ${{ env.SYSTEMC_VERSION }}
        if: steps.cache-sc.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q \
            https://github.com/accellera-official/systemc/archive/refs/tags/${{ env.SYSTEMC_VERSION }}.tar.gz
          tar zxf ${{ env.SYSTEMC_VERSION }}.tar.gz
          cd systemc-${{ env.SYSTEMC_VERSION }}
          touch docs/DEVELOPMENT.md
          mkdir objdir && cd objdir
          ../configure \
            --prefix=${{ env.SYSTEMC_HOME }} \
            CXXFLAGS="-std=c++${{ env.CXX_STD }}"
          make -j$(nproc)
          make install

      # ── CCI 1.0.2 (CMake build, RapidJSON bundled) ─────────────────────────
      # CCI 1.0.2 (Oct 2025) fixes the cci_value_iterator C++20 regression
      # present in 1.0.1 where value_type was inherited from std::iterator<>
      # (deprecated/inaccessible in GCC 11 C++20 concept checks).
      # RapidJSON is bundled inside the 1.0.2 tarball — no separate clone.
      - name: Cache CCI ${{ env.CCI_VERSION }}
        id: cache-cci
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Build CCI ${{ env.CCI_VERSION }}
        if: steps.cache-cci.outputs.cache-hit != 'true'
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
        run: |
          cd /tmp
          wget -q \
            https://github.com/accellera-official/cci/releases/download/v${{ env.CCI_VERSION }}/cci_v${{ env.CCI_VERSION }}.tar.gz
          tar zxf cci_v${{ env.CCI_VERSION }}.tar.gz
          cd cci_v${{ env.CCI_VERSION }}
          cmake -S . -B build \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STD }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ env.CCI_HOME }} \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSYSTEMCCCI_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cmake --install build

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — build sep-vp
# ─────────────────────────────────────────────────────────────────────────────
  sep-vp:
    name: Build sep-vp
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev \
            libssl-dev

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Configure VP
        # SYSTEMC_HOME and CCI_HOME come from the workflow-level env block and
        # are picked up by configure_vp.sh's auto-discovery (no explicit export
        # needed — the script honours existing env vars before probing).
        env:
          CMAKE_BUILD_TYPE:    Release
          CMAKE_CXX_STANDARD:  ${{ env.CXX_STD }}
          SYSTEMC_HOME:        ${{ env.SYSTEMC_HOME }}
          CCI_HOME:            ${{ env.CCI_HOME }}
        run: cd vp && ./configure_vp.sh

      - name: Build sep-vp
        run: make sep-vp -C vp/build -j$(nproc)

      - name: Verify binary exists
        run: test -x vp/build/bin/sep-vp

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — SEP peripheral unit tests
# ─────────────────────────────────────────────────────────────────────────────
  sep-unit-tests:
    name: SEP peripheral unit tests
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake lcov \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev \
            libssl-dev

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run all SEP peripheral tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
        run: sep/peripherals/run_all_peripherals.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep-peripheral-logs
          path: sep/peripherals/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 — SMC peripheral unit tests
# Runs through the run_all_smc_tests.sh orchestrator (Release + ASAN +
# Coverage + CTest) for all peripherals under smc/peripherals/.
# cpu_cluster is not in the orchestrator — it requires the Tenstorrent-
# internal Whisper ISS (WHISPER_HOME).
# ─────────────────────────────────────────────────────────────────────────────
  smc-unit-tests:
    name: SMC peripheral unit tests
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake gcovr \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run SMC peripheral tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
        run: |
          smc/run_all_smc_tests.sh \
            bootrom clint dma i3c_controller plic pvt_wrap reset_unit scratchpad_ram \
            telemetry_receiver

      - name: Upload SMC peripheral test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-peripheral-logs
          path: smc/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 5 — SMC Fabric unit tests
# Runs through the run_all_smc_tests.sh orchestrator (Release + ASAN +
# Coverage + CTest) for smc_fabric.
# ─────────────────────────────────────────────────────────────────────────────
  smc-fabric-tests:
    name: SMC Fabric unit tests
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake gcovr

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Run SMC Fabric tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
        run: |
          smc/run_all_smc_tests.sh smc_fabric

      - name: Upload SMC Fabric test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-fabric-logs
          path: smc/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 6 — build smc-vp and run SMC VP firmware tests
# The SMC platform requires the Tenstorrent-internal Whisper ISS.  We clone it,
# build librvcore.a, then configure the VP with WHISPER_HOME and run all
# bare-metal firmware tests under sw/smc-vp-tests, then Zephyr hello_world
# and mmio_poke via sw/zephyr-smc/zephyr_smc.sh ci.
# ─────────────────────────────────────────────────────────────────────────────
  smc-vp:
    name: SMC VP firmware tests
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake make ninja-build gperf \
            device-tree-compiler python3-pip python3-venv python3-setuptools \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev \
            libssl-dev gcc-riscv64-unknown-elf

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Cache Whisper
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: /home/runner/whisper
          # The "-libs4" suffix versions the build RECIPE, not the Whisper
          # revision: entries saved by the earlier recipe contain a tree with
          # only librvcore.a built.  Bump it whenever the artifact set built
          # below changes, so stale/incomplete entries are not reused.
          key: whisper-${{ env.WHISPER_REV }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libs4

      # A cache hit is not proof the tree is usable: actions/cache saves the
      # directory in a post-job step even when the job failed, so one bad build
      # can be cached and then restored on every subsequent run, permanently
      # skipping the build step below.  Gate that step on the artifacts really
      # being present instead of on cache-hit.
      - name: Check Whisper artifacts
        id: whisper-libs
        run: |
          complete=true
          for lib in build-$(uname -s)/librvcore.a \
                     virtual_memory/libvirtual_memory.a \
                     pci/libpci.a \
                     third_party/softfloat/build/RISCV-GCC/softfloat.a; do
            if [ ! -f "/home/runner/whisper/${lib}" ]; then
              echo "missing: ${lib}"
              complete=false
            fi
          done
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"

      - name: Build Whisper
        if: steps.whisper-libs.outputs.complete != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a minimal Boost root that only exposes the headers so the
          # Makefile does not add -isystem /usr, which shadows libc headers.
          mkdir -p /tmp/boost/include
          ln -s /usr/include/boost /tmp/boost/include/boost

          # This step also runs when the cache restored an INCOMPLETE tree, so
          # the clone target may already exist -- reuse it rather than failing
          # with "destination path already exists".  No fetch is needed: the
          # cache key pins WHISPER_REV, so the checkout is already at that rev.
          if [ -d /home/runner/whisper/.git ]; then
            echo "reusing restored Whisper checkout; building missing artifacts"
          else
            git clone \
              https://x-access-token:${GIT_TOKEN}@github.com/tenstorrent/whisper.git \
              /home/runner/whisper
          fi
          cd /home/runner/whisper
          git checkout ${{ env.WHISPER_REV }}
          # smc/cpu_cluster/external/whisper-cmake/CMakeLists.txt imports FOUR
          # archives: librvcore.a plus the softfloat/pci/virtual_memory
          # sub-libs.  Whisper's GNUmakefile wires those three as prerequisites
          # of the `whisper` executable only -- not of librvcore.a -- so asking
          # for librvcore.a alone silently skips them and the CMake configure
          # step later fails with "Whisper artifact not found".  They also
          # cannot be named as relative goals ("No rule to make target"): the
          # makefile defines them by absolute path, one of which even carries a
          # double slash ($PWD/virtual_memory//libvirtual_memory.a).  So add a
          # single aggregate goal expressed in the makefile's own variables --
          # no hard-coded paths, and no executable link.
          printf 'smc_vp_whisper_libs: $(BUILD_DIR)/librvcore.a $(soft_float_lib) $(pci_lib) $(virtual_memory_lib)\n' \
            > /tmp/whisper-smc-libs.mk
          make -f GNUmakefile -f /tmp/whisper-smc-libs.mk \
            MEM_CALLBACKS=1 CXX_STD=c++20 BOOST_ROOT=/tmp/boost \
            smc_vp_whisper_libs -j$(nproc)

      - name: Run SMC VP tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
          WHISPER_HOME: /home/runner/whisper
          BOOST_DIR:    /usr
        run: |
          cd sw/smc-vp-tests
          ./run_smc_vp_tests.sh

      # Zephyr 4.3 emits -march=rv64imac_zicsr_zifencei.  Ubuntu 22.04's
      # gcc-riscv64-unknown-elf (GCC 10) rejects the 'z' subsets; use the
      # same xpack GCC 15 as smu-vp / RHEL.
      - name: Install RISC-V toolchain (xpack)
        run: |
          mkdir -p /home/runner/riscv
          cd /home/runner/riscv
          XPACK="xpack-riscv-none-elf-gcc-${{ env.RISCV_XPACK_VERSION }}-linux-x64"
          wget -q "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.RISCV_XPACK_VERSION }}/${XPACK}.tar.gz"
          tar zxf "${XPACK}.tar.gz"
          EXTRACTED_DIR=$(tar tzf "${XPACK}.tar.gz" | head -1 | cut -d/ -f1)
          mv "${EXTRACTED_DIR}" toolchain
          echo "/home/runner/riscv/toolchain/bin" >> "$GITHUB_PATH"

      - name: Cache Zephyr west workspace
        id: cache-zephyr
        uses: actions/cache@v4
        with:
          path: |
            sw/zephyr-smc/.workspace
            sw/zephyr-smc/.venv
          key: zephyr-${{ env.ZEPHYR_VERSION }}-${{ runner.os }}-west1

      - name: Run Zephyr SMC VP tests
        env:
          SYSTEMC_HOME:    ${{ env.SYSTEMC_HOME }}
          CCI_HOME:        ${{ env.CCI_HOME }}
          WHISPER_HOME:    /home/runner/whisper
          BOOST_DIR:       /usr
          ZEPHYR_VERSION:  ${{ env.ZEPHYR_VERSION }}
          ZEPHYR_SKIP_UPDATE: ${{ steps.cache-zephyr.outputs.cache-hit == 'true' && '1' || '0' }}
          RISCV_PREFIX:    riscv-none-elf-
          CROSS_COMPILE:   /home/runner/riscv/toolchain/bin/riscv-none-elf-
          SMC_VP:          ${{ github.workspace }}/vp/build_smc/bin/smc-vp
        run: |
          if [ ! -x "$SMC_VP" ]; then
            SMC_VP="${{ github.workspace }}/vp/build/bin/smc-vp"
          fi
          export SMC_VP
          test -x "$SMC_VP"
          cd sw/zephyr-smc
          ./zephyr_smc.sh ci

      - name: Upload smc-vp logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-vp-logs
          path: |
            sw/smc-vp-tests/smc-*/run_*.log
            sw/zephyr-smc/build/*/run.log
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 7 — SMU interconnect unit tests
# Header-only smu_axi_xbar + axi_window_remap; SystemC + CCI only (no Whisper).
# Release + ASAN + Coverage as three separate run_tests.sh invocations.
# ─────────────────────────────────────────────────────────────────────────────
  smu-unit-tests:
    name: SMU interconnect unit tests
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake gcovr

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run SMU interconnect tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
        run: |
          cd vp/platform/smu
          ./run_tests.sh
          ./run_tests.sh --asan
          ./run_tests.sh --coverage

# ─────────────────────────────────────────────────────────────────────────────
# Job 8 — build smu-vp and run SMU VP firmware tests
# smu-vp links Whisper into a shared library (libsmc_cluster_smu), so the
# Whisper archives must be built -fPIC.  Firmware halves are RV64 (SMC) and
# RV32 (SEP); the xpack riscv-none-elf toolchain covers both.
# ─────────────────────────────────────────────────────────────────────────────
  smu-vp:
    name: SMU VP firmware tests
    runs-on: ubuntu-22.04
    needs: build-deps

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake make wget \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev \
            libssl-dev

      - name: Install RISC-V toolchain (xpack, RV32+RV64)
        run: |
          mkdir -p /home/runner/riscv
          cd /home/runner/riscv
          XPACK="xpack-riscv-none-elf-gcc-${{ env.RISCV_XPACK_VERSION }}-linux-x64"
          wget -q "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.RISCV_XPACK_VERSION }}/${XPACK}.tar.gz"
          tar zxf "${XPACK}.tar.gz"
          EXTRACTED_DIR=$(tar tzf "${XPACK}.tar.gz" | head -1 | cut -d/ -f1)
          mv "${EXTRACTED_DIR}" toolchain
          echo "/home/runner/riscv/toolchain/bin" >> "$GITHUB_PATH"

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Cache Whisper (PIC)
        id: cache-whisper-pic
        uses: actions/cache@v4
        with:
          path: /home/runner/whisper
          # Distinct from the smc-vp "-libs4" cache: smu-vp needs PIC objects
          # to link librvcore.a into libsmc_cluster_smu.so.
          key: whisper-${{ env.WHISPER_REV }}-${{ runner.os }}-cxx${{ env.CXX_STD }}-libs4-pic

      - name: Check Whisper artifacts
        id: whisper-libs-pic
        run: |
          complete=true
          for lib in build-$(uname -s)/librvcore.a \
                     virtual_memory/libvirtual_memory.a \
                     pci/libpci.a \
                     third_party/softfloat/build/RISCV-GCC/softfloat.a; do
            if [ ! -f "/home/runner/whisper/${lib}" ]; then
              echo "missing: ${lib}"
              complete=false
            fi
          done
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"

      - name: Build Whisper (-fPIC)
        if: steps.whisper-libs-pic.outputs.complete != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/boost/include
          ln -s /usr/include/boost /tmp/boost/include/boost

          if [ -d /home/runner/whisper/.git ]; then
            echo "reusing restored Whisper checkout; building missing artifacts"
          else
            git clone \
              https://x-access-token:${GIT_TOKEN}@github.com/tenstorrent/whisper.git \
              /home/runner/whisper
          fi
          cd /home/runner/whisper
          git checkout ${{ env.WHISPER_REV }}
          printf 'smc_vp_whisper_libs: $(BUILD_DIR)/librvcore.a $(soft_float_lib) $(pci_lib) $(virtual_memory_lib)\n' \
            > /tmp/whisper-smc-libs.mk
          make -f GNUmakefile -f /tmp/whisper-smc-libs.mk \
            MEM_CALLBACKS=1 CXX_STD=c++20 EXTRA_CXXFLAGS=-fPIC \
            BOOST_ROOT=/tmp/boost \
            smc_vp_whisper_libs -j$(nproc)

      - name: Build smu-vp and run SMU VP tests
        env:
          SYSTEMC_HOME:         ${{ env.SYSTEMC_HOME }}
          CCI_HOME:             ${{ env.CCI_HOME }}
          WHISPER_HOME:         /home/runner/whisper
          BOOST_DIR:            /usr
          RISCV_PREFIX:         riscv-none-elf-
          RISCV_TOOLCHAIN_PATH: /home/runner/riscv/toolchain
        run: |
          cmake -S vp -B vp/build_smc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STD }} \
            -DSMC_CXX_STANDARD=${{ env.CXX_STD }}
          cmake --build vp/build_smc --target smu-vp -j$(nproc)
          cd sw/smu-vp-tests
          ./run_smu_vp_tests.sh
