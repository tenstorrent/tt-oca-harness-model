# CI for tt-oca-harness-model — RHEL 8 compatibility
#
# Runs the same five job groups as ci.yml but inside an almalinux:8 container
# (binary-compatible with RHEL 8).  Key differences vs the Ubuntu workflow:
#
#  • Package manager : dnf with EPEL + PowerTools repos
#  • C++ compiler    : GCC 12 via gcc-toolset-12 (SCL)
#    Default GCC on RHEL 8 is 8.5 which does not support C++20.
#  • ASan / UBSan    : gcc-toolset-12-libasan-devel + gcc-toolset-12-libubsan-devel
#    (the compiler meta-package does not pull in the 64-bit sanitizer runtimes;
#    without them -fsanitize=address fails with "cannot find -lasan").
#  • OpenSSL         : Built from source (3.3.x) because RHEL 8 ships 1.1.1
#    and the kmac peripheral requires EVP_MAC / openssl/core_names.h (≥ 3.0).
#  • Library paths   : /usr/lib64  (not /usr/lib/x86_64-linux-gnu as on Ubuntu)
#
# Cache keys include the "-rhel8" suffix to avoid mixing with Ubuntu caches
# (runner.os is "Linux" for both since containers share the Ubuntu host).
#
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
#  build-deps-rhel8      Build + cache SystemC 3.0.2, OpenSSL 3.3.x, CCI 1.0.2
#  sep-vp-rhel8          Build sep-vp and run SEP VP firmware tests (needs
#                        build-deps-rhel8 + RISC-V xpack toolchain). VeeR ISS
#                        is in-tree; no Whisper required.
#  sep-unit-tests-rhel8  Run SEP peripheral unit tests, SEP CPU tests, and the
#                        host-only SEP platform xbar_policy tests
#                        (vp/platform/sep/run_tests.sh)
#  smc-unit-tests-rhel8  Run SMC peripheral unit tests (includes the new DMA
#                        and PVT wrapper peripheral unit tests, and AOU)
#  smc-fabric-tests-rhel8  Run SMC Fabric tests
#
#  smc-vp-rhel8          Build smc-vp and run SMC VP firmware tests (needs
#                        build-deps-rhel8 + Whisper ISS + RISC-V toolchain),
#                        including the new smc-dma-test and smc-pvt-wrap-test.
#                        Uploads the smc-vp binary for the Zephyr job.
#  smc-zephyr-rhel8      Zephyr hello_world + mmio_poke on a separate AlmaLinux 8
#                        runner so the west cache is not unpacked on top of
#                        Whisper + vp/build_smc (same ENOSPC as Ubuntu PR #106).
#  smu-unit-tests-rhel8  SMU interconnect unit tests (Release + ASAN + Coverage).
#  smu-vp-rhel8          Build smu-vp and run SMU VP firmware tests
#                        (smu-link-test, smu-xbar-test, smu-traffic-test,
#                        smu-aou-ext-test). Whisper rebuilt -fPIC; xpack
#                        RISC-V toolchain for RV32+RV64.
# ─────────────────────────────────────────────────────────────────────────────

name: CI (RHEL 8)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, rhel8-support]

env:
  SYSTEMC_VERSION:  "3.0.2"
  CCI_VERSION:      "1.0.2"
  OPENSSL3_VERSION: "3.3.2"
  BOOST_VERSION:    "1.84.0"
  WHISPER_REV:      "a53d0f3e"  # tenstorrent/whisper commit the SMC VP was validated against
  RISCV_XPACK_VERSION: "15.2.0-1"
  ZEPHYR_VERSION:   "v4.3.0"
  SYSTEMC_HOME:     /home/runner/local/systemc-3.0.2
  CCI_HOME:         /home/runner/local/cci-1.0.2
  OPENSSL3_HOME:    /home/runner/local/openssl-3.3.2
  BOOST_HOME:       /home/runner/local/boost-1.84.0
  CXX_STD:          "20"
  GCC_TOOLSET:      "gcc-toolset-12"

# ─────────────────────────────────────────────────────────────────────────────
# Reusable step fragments (referenced via YAML anchors, not supported in GHA —
# shared setup is duplicated per job intentionally to keep each job standalone)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — build and cache SystemC + OpenSSL 3 + CCI on RHEL 8
# ─────────────────────────────────────────────────────────────────────────────
  build-deps-rhel8:
    name: Build SystemC + OpenSSL 3 + Boost 1.84 + CCI (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build tools
        run: |
          # Full gcc-toolset-12 meta-package (gcc + g++).  ASan/UBSan runtimes
          # are *not* included here; unit-test jobs install
          # gcc-toolset-12-libasan-devel / libubsan-devel separately.
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            cmake make \
            autoconf automake libtool \
            wget tar gzip perl-IPC-Cmd

      # Activate GCC toolset 12 for all subsequent steps in this job
      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Verify toolchain (GCC 12 required for C++20)
        run: |
          gcc  --version
          g++  --version
          cmake --version

      # ── SystemC ────────────────────────────────────────────────────────────
      - name: Cache SystemC ${{ env.SYSTEMC_VERSION }} (RHEL 8)
        id: cache-sc-rhel8
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Build SystemC ${{ env.SYSTEMC_VERSION }}
        if: steps.cache-sc-rhel8.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname ${{ env.SYSTEMC_HOME }})"
          cd /tmp
          wget -q \
            https://github.com/accellera-official/systemc/archive/refs/tags/${{ env.SYSTEMC_VERSION }}.tar.gz
          tar zxf ${{ env.SYSTEMC_VERSION }}.tar.gz
          cd systemc-${{ env.SYSTEMC_VERSION }}
          touch docs/DEVELOPMENT.md
          mkdir objdir && cd objdir
          ../configure \
            --prefix=${{ env.SYSTEMC_HOME }} \
            CXXFLAGS="-std=c++${{ env.CXX_STD }}"
          make -j$(nproc)
          make install

      # ── Boost 1.84 ─────────────────────────────────────────────────────────
      # RHEL 8 ships Boost 1.66 which uses std::allocator::allocate(n, hint) —
      # an overload removed in C++20.  Build Boost 1.84 (C++20-clean) from
      # source.  CCI is also built against this Boost to avoid ODR issues.
      - name: Cache Boost ${{ env.BOOST_VERSION }} (RHEL 8)
        id: cache-boost-rhel8
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Build Boost ${{ env.BOOST_VERSION }}
        if: steps.cache-boost-rhel8.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname ${{ env.BOOST_HOME }})"
          cd /tmp
          BOOST_UNDER="boost_$(echo ${{ env.BOOST_VERSION }} | tr . _)"
          wget -q "https://archives.boost.io/release/${{ env.BOOST_VERSION }}/source/${BOOST_UNDER}.tar.gz"
          tar zxf "${BOOST_UNDER}.tar.gz"
          cd "${BOOST_UNDER}"
          ./bootstrap.sh --prefix=${{ env.BOOST_HOME }}
          ./b2 install \
            --with-atomic --with-chrono --with-date_time --with-filesystem \
            --with-iostreams --with-log --with-program_options --with-regex \
            --with-system --with-thread \
            link=static threading=multi variant=release \
            cxxflags=-fPIC cflags=-fPIC \
            cxxstd=17 \
            -j$(nproc) \
            > /tmp/boost-build.log 2>&1 || { tail -30 /tmp/boost-build.log; exit 1; }

      # ── OpenSSL 3 ──────────────────────────────────────────────────────────
      # RHEL 8 ships OpenSSL 1.1.1.  The kmac peripheral uses EVP_MAC and
      # openssl/core_names.h which require OpenSSL >= 3.0.  Build from source.
      - name: Cache OpenSSL ${{ env.OPENSSL3_VERSION }} (RHEL 8)
        id: cache-ssl-rhel8
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL3_HOME }}
          key: openssl-${{ env.OPENSSL3_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Build OpenSSL ${{ env.OPENSSL3_VERSION }}
        if: steps.cache-ssl-rhel8.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname ${{ env.OPENSSL3_HOME }})"
          cd /tmp
          wget -q \
            https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL3_VERSION }}/openssl-${{ env.OPENSSL3_VERSION }}.tar.gz
          tar zxf openssl-${{ env.OPENSSL3_VERSION }}.tar.gz
          cd openssl-${{ env.OPENSSL3_VERSION }}
          ./Configure \
            --prefix=${{ env.OPENSSL3_HOME }} \
            --openssldir=${{ env.OPENSSL3_HOME }}/ssl \
            no-shared \
            linux-x86_64
          make -j$(nproc)
          make install_sw

      # ── CCI 1.0.2 ──────────────────────────────────────────────────────────
      - name: Cache CCI ${{ env.CCI_VERSION }} (RHEL 8)
        id: cache-cci-rhel8
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Build CCI ${{ env.CCI_VERSION }}
        if: steps.cache-cci-rhel8.outputs.cache-hit != 'true'
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
        run: |
          mkdir -p "$(dirname ${{ env.CCI_HOME }})"
          cd /tmp
          wget -q \
            https://github.com/accellera-official/cci/releases/download/v${{ env.CCI_VERSION }}/cci_v${{ env.CCI_VERSION }}.tar.gz
          tar zxf cci_v${{ env.CCI_VERSION }}.tar.gz
          cd cci_v${{ env.CCI_VERSION }}
          cmake -S . -B build \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STD }} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ env.CCI_HOME }} \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBOOST_ROOT=${{ env.BOOST_HOME }} \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DSYSTEMCCCI_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cmake --install build

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — build sep-vp and run SEP VP firmware tests on RHEL 8
# VeeR ISS is in-tree; no Whisper.  xpack RISC-V gcc builds the RV32 firmware.
# Pre-build sep-vp so the runner does not try to rebuild the VP (that path
# would demand WHISPER_HOME).
# ─────────────────────────────────────────────────────────────────────────────
  sep-vp-rhel8:
    name: SEP VP firmware tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            cmake make git wget which python3 procps-ng \
            zlib-devel readline-devel

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Install RISC-V toolchain
        run: |
          mkdir -p /home/runner/riscv
          cd /home/runner/riscv
          XPACK="xpack-riscv-none-elf-gcc-${{ env.RISCV_XPACK_VERSION }}-linux-x64"
          wget -q "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.RISCV_XPACK_VERSION }}/${XPACK}.tar.gz"
          tar zxf "${XPACK}.tar.gz"
          rm -f "${XPACK}.tar.gz"
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name 'xpack-riscv-none-elf-gcc-*' | head -1)
          mv "${EXTRACTED_DIR}" toolchain
          echo "/home/runner/riscv/toolchain/bin" >> "$GITHUB_PATH"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore Boost cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Restore OpenSSL 3 cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL3_HOME }}
          key: openssl-${{ env.OPENSSL3_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Configure VP
        env:
          CMAKE_BUILD_TYPE:    Release
          CMAKE_CXX_STANDARD:  ${{ env.CXX_STD }}
          SYSTEMC_HOME:        ${{ env.SYSTEMC_HOME }}
          CCI_HOME:            ${{ env.CCI_HOME }}
          BOOST_ROOT:          ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:        ${{ env.OPENSSL3_HOME }}
        run: cd vp && ./configure_vp.sh

      - name: Build sep-vp
        run: make sep-vp -C vp/build -j$(nproc)

      - name: Verify binary exists
        run: test -x vp/build/bin/sep-vp

      - name: Run SEP VP firmware tests
        env:
          SYSTEMC_HOME:         ${{ env.SYSTEMC_HOME }}
          CCI_HOME:             ${{ env.CCI_HOME }}
          BOOST_DIR:            ${{ env.BOOST_HOME }}
          BOOST_ROOT:           ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:         ${{ env.OPENSSL3_HOME }}
          OPENSSL_ROOT_DIR:     ${{ env.OPENSSL3_HOME }}
          RISCV_TOOLCHAIN_PATH: /home/runner/riscv/toolchain
          RISCV_PREFIX:         riscv-none-elf-
          VP:                   ${{ github.workspace }}/vp/build/bin/sep-vp
        run: |
          cd sw/sep-vp-tests
          ./run_sep_vp_tests.sh

      - name: Upload sep-vp logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep-vp-logs-rhel8
          path: sw/sep-vp-tests/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 — SEP peripheral unit tests on RHEL 8
# ─────────────────────────────────────────────────────────────────────────────
  sep-unit-tests-rhel8:
    name: SEP peripheral unit tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          # libasan-devel / libubsan-devel are not pulled in by the
          # gcc-toolset-12 meta-package; they supply the 64-bit -lasan/-lubsan
          # used by --asan (SEP also enables UBSan).
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            ${{ env.GCC_TOOLSET }}-libasan-devel \
            ${{ env.GCC_TOOLSET }}-libubsan-devel \
            cmake git python3 \
            zlib-devel readline-devel \
            lcov

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"
          # Point lcov/gcov at the toolset's gcov binary
          echo "GCOV=$(which gcov)"                      >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore Boost cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Restore OpenSSL 3 cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL3_HOME }}
          key: openssl-${{ env.OPENSSL3_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run all SEP peripheral tests
        env:
          SYSTEMC_HOME:     ${{ env.SYSTEMC_HOME }}
          CCI_HOME:         ${{ env.CCI_HOME }}
          BOOST_ROOT:       ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:     ${{ env.OPENSSL3_HOME }}
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL3_HOME }}
        run: sep/peripherals/run_all_peripherals.sh

      - name: Run SEP CPU (VeeR-ISS TLM) tests
        env:
          SYSTEMC_HOME:     ${{ env.SYSTEMC_HOME }}
          CCI_HOME:         ${{ env.CCI_HOME }}
          BOOST_ROOT:       ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:     ${{ env.OPENSSL3_HOME }}
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL3_HOME }}
        run: |
          sep/cpu/run_tests.sh
          sep/cpu/run_tests.sh --asan
          sep/cpu/run_tests.sh --coverage

      # Host-only (no SystemC) unit test of the SEP platform xbar address /
      # permission policy (vp/platform/sep/inc/xbar_policy.h), incl. the
      # csr_region trim to 0x10A50000 (tt-oca-hw #2587).  Coverage via lcov +
      # the toolset gcov ($GCOV).
      - name: Run SEP platform xbar_policy tests
        run: |
          vp/platform/sep/run_tests.sh
          vp/platform/sep/run_tests.sh --asan
          vp/platform/sep/run_tests.sh --coverage

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sep-peripheral-logs-rhel8
          path: sep/peripherals/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 — SMC peripheral unit tests on RHEL 8
# SMC peripherals use CCI but not OpenSSL — no custom OpenSSL needed here.
# ─────────────────────────────────────────────────────────────────────────────
  smc-unit-tests-rhel8:
    name: SMC peripheral unit tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            ${{ env.GCC_TOOLSET }}-libasan-devel \
            ${{ env.GCC_TOOLSET }}-libubsan-devel \
            cmake git \
            python3-pip
          pip3 install --quiet gcovr

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore Boost cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run SMC peripheral tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
          BOOST_ROOT:   ${{ env.BOOST_HOME }}
        run: |
          smc/run_all_smc_tests.sh \
            bootrom clint dma i3c_controller octs_system_timer plic pvt_wrap reset_unit scratchpad_ram \
            telemetry_receiver aou

      - name: Upload SMC peripheral test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-peripheral-logs-rhel8
          path: smc/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 5 — SMC Fabric unit tests on RHEL 8
# smc_fabric now needs SystemC + CCI (hang-detector cycle period is a cci_param).
# ─────────────────────────────────────────────────────────────────────────────
  smc-fabric-tests-rhel8:
    name: SMC Fabric unit tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            ${{ env.GCC_TOOLSET }}-libasan-devel \
            ${{ env.GCC_TOOLSET }}-libubsan-devel \
            cmake git \
            python3-pip
          pip3 install --quiet gcovr

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run SMC Fabric tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
        run: |
          smc/run_all_smc_tests.sh smc_fabric

      - name: Upload SMC Fabric test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-fabric-logs-rhel8
          path: smc/logs/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 6 — build smc-vp and run SMC VP firmware tests on RHEL 8
# The SMC platform requires the Whisper ISS (https://github.com/tenstorrent/whisper).  We clone it,
# build librvcore.a with gcc-toolset-12, then configure the VP with WHISPER_HOME
# and run all bare-metal firmware tests under sw/smc-vp-tests.  Zephyr lives in
# smc-zephyr-rhel8 so the west workspace does not share this job's disk.
# ─────────────────────────────────────────────────────────────────────────────
  smc-vp-rhel8:
    name: SMC VP firmware tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            cmake make git wget which \
            zlib-devel readline-devel

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Install RISC-V toolchain
        run: |
          mkdir -p /home/runner/riscv
          cd /home/runner/riscv
          XPACK="xpack-riscv-none-elf-gcc-${{ env.RISCV_XPACK_VERSION }}-linux-x64"
          wget -q "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.RISCV_XPACK_VERSION }}/${XPACK}.tar.gz"
          tar zxf "${XPACK}.tar.gz"
          rm -f "${XPACK}.tar.gz"
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name 'xpack-riscv-none-elf-gcc-*' | head -1)
          mv "${EXTRACTED_DIR}" toolchain
          echo "/home/runner/riscv/toolchain/bin" >> "$GITHUB_PATH"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore Boost cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      # smc-vp links the whole VP tree, including the SEP peripherals that call
      # peripheral_find_openssl().  RHEL 8 ships no openssl-devel in this image,
      # so the from-source OpenSSL 3 built by build-deps-rhel8 is required here
      # too -- not just in the SEP jobs.
      - name: Restore OpenSSL 3 cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL3_HOME }}
          key: openssl-${{ env.OPENSSL3_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Cache Whisper
        id: cache-whisper-rhel8
        uses: actions/cache@v4
        with:
          path: /home/runner/whisper
          # The "-libs4" suffix versions the build RECIPE, not the Whisper
          # revision: entries saved by the earlier recipe contain a tree with
          # only librvcore.a built.  Bump it whenever the artifact set built
          # below changes, so stale/incomplete entries are not reused.
          key: whisper-${{ env.WHISPER_REV }}-rhel8-cxx${{ env.CXX_STD }}-libs4

      # A cache hit is not proof the tree is usable: actions/cache saves the
      # directory in a post-job step even when the job failed, so one bad build
      # can be cached and then restored on every subsequent run, permanently
      # skipping the build step below.  Gate that step on the artifacts really
      # being present instead of on cache-hit.
      - name: Check Whisper artifacts
        id: whisper-libs-rhel8
        run: |
          complete=true
          for lib in build-$(uname -s)/librvcore.a \
                     virtual_memory/libvirtual_memory.a \
                     pci/libpci.a \
                     third_party/softfloat/build/RISCV-GCC/softfloat.a; do
            if [ ! -f "/home/runner/whisper/${lib}" ]; then
              echo "missing: ${lib}"
              complete=false
            fi
          done
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"

      - name: Build Whisper
        if: steps.whisper-libs-rhel8.outputs.complete != 'true'
        env:
          BOOST_ROOT: ${{ env.BOOST_HOME }}
        run: |
          # Create a minimal Boost root that only exposes the headers so the
          # Makefile does not add -isystem $BOOST_HOME, which could shadow libc
          # headers if the prefix contains unrelated directories.
          mkdir -p /tmp/boost/include
          ln -s "$BOOST_HOME/include/boost" /tmp/boost/include/boost

          # This step also runs when the cache restored an INCOMPLETE tree, so
          # the clone target may already exist -- reuse it rather than failing
          # with "destination path already exists".  No fetch is needed: the
          # cache key pins WHISPER_REV, so the checkout is already at that rev.
          if [ -d /home/runner/whisper/.git ]; then
            echo "reusing restored Whisper checkout; building missing artifacts"
          else
            git clone \
              https://github.com/tenstorrent/whisper.git \
              /home/runner/whisper
          fi
          cd /home/runner/whisper
          git checkout ${{ env.WHISPER_REV }}
          # smc/cpu_cluster/external/whisper-cmake/CMakeLists.txt imports FOUR
          # archives: librvcore.a plus the softfloat/pci/virtual_memory
          # sub-libs.  Whisper's GNUmakefile wires those three as prerequisites
          # of the `whisper` executable only -- not of librvcore.a -- so asking
          # for librvcore.a alone silently skips them and the CMake configure
          # step later fails with "Whisper artifact not found".  They also
          # cannot be named as relative goals ("No rule to make target"): the
          # makefile defines them by absolute path, one of which even carries a
          # double slash ($PWD/virtual_memory//libvirtual_memory.a).  So add a
          # single aggregate goal expressed in the makefile's own variables --
          # no hard-coded paths, and no executable link.
          printf 'smc_vp_whisper_libs: $(BUILD_DIR)/librvcore.a $(soft_float_lib) $(pci_lib) $(virtual_memory_lib)\n' \
            > /tmp/whisper-smc-libs.mk
          make -f GNUmakefile -f /tmp/whisper-smc-libs.mk \
            MEM_CALLBACKS=1 CXX_STD=c++20 BOOST_ROOT=/tmp/boost \
            smc_vp_whisper_libs -j$(nproc)

      - name: Run SMC VP tests
        env:
          SYSTEMC_HOME:         ${{ env.SYSTEMC_HOME }}
          CCI_HOME:             ${{ env.CCI_HOME }}
          WHISPER_HOME:         /home/runner/whisper
          BOOST_DIR:            ${{ env.BOOST_HOME }}
          BOOST_ROOT:           ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:         ${{ env.OPENSSL3_HOME }}
          OPENSSL_ROOT_DIR:     ${{ env.OPENSSL3_HOME }}
          RISCV_TOOLCHAIN_PATH: /home/runner/riscv/toolchain
        run: |
          cd sw/smc-vp-tests
          ./run_smc_vp_tests.sh

      - name: Upload smc-vp binary
        uses: actions/upload-artifact@v4
        with:
          name: smc-vp-bin-rhel8
          path: vp/build_smc/bin/smc-vp
          if-no-files-found: error
          retention-days: 1

      - name: Upload smc-vp logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-vp-logs-rhel8
          path: sw/smc-vp-tests/smc-*/run_*.log
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 7 — Zephyr on smc-vp (RHEL 8).  Own AlmaLinux 8 container: west cache
# must not share disk with Whisper + vp/build_smc (ENOSPC on PR #111).
# ─────────────────────────────────────────────────────────────────────────────
  smc-zephyr-rhel8:
    name: Zephyr SMC VP tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: [build-deps-rhel8, smc-vp-rhel8]

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            cmake make git wget which ninja-build dtc gperf \
            python3.11 python3.11-pip python3.11-devel
          dnf clean all

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore Boost cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Restore OpenSSL 3 cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL3_HOME }}
          key: openssl-${{ env.OPENSSL3_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Download smc-vp binary
        uses: actions/download-artifact@v4
        with:
          name: smc-vp-bin-rhel8
          path: vp/build_smc/bin

      - name: Install RISC-V toolchain
        run: |
          mkdir -p /home/runner/riscv
          cd /home/runner/riscv
          XPACK="xpack-riscv-none-elf-gcc-${{ env.RISCV_XPACK_VERSION }}-linux-x64"
          wget -q "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.RISCV_XPACK_VERSION }}/${XPACK}.tar.gz"
          tar zxf "${XPACK}.tar.gz"
          rm -f "${XPACK}.tar.gz"
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name 'xpack-riscv-none-elf-gcc-*' | head -1)
          mv "${EXTRACTED_DIR}" toolchain
          echo "/home/runner/riscv/toolchain/bin" >> "$GITHUB_PATH"
          df -h

      - name: Cache Zephyr west workspace
        id: cache-zephyr-rhel8
        uses: actions/cache@v4
        with:
          path: |
            sw/zephyr-smc/.workspace
          # west3: cache .workspace only. Do not cache .venv — venv shebangs
          # are absolute and break when the checkout path changes (repo
          # rename/port). west2 also bundled .venv. Do not reuse west1
          # (includes unused vendor HAL git history and fills the disk).
          key: zephyr-${{ env.ZEPHYR_VERSION }}-rhel8-west3-narrow

      - name: Run Zephyr SMC VP tests
        env:
          SYSTEMC_HOME:         ${{ env.SYSTEMC_HOME }}
          CCI_HOME:             ${{ env.CCI_HOME }}
          BOOST_DIR:            ${{ env.BOOST_HOME }}
          BOOST_ROOT:           ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:         ${{ env.OPENSSL3_HOME }}
          OPENSSL_ROOT_DIR:     ${{ env.OPENSSL3_HOME }}
          RISCV_TOOLCHAIN_PATH: /home/runner/riscv/toolchain
          RISCV_PREFIX:         riscv-none-elf-
          CROSS_COMPILE:        /home/runner/riscv/toolchain/bin/riscv-none-elf-
          ZEPHYR_VERSION:       ${{ env.ZEPHYR_VERSION }}
          ZEPHYR_SKIP_UPDATE:   ${{ steps.cache-zephyr-rhel8.outputs.cache-hit == 'true' && '1' || '0' }}
          ZEPHYR_WEST_PROJECT_FILTER: "-hal_espressif,-hal_nordic,-hal_stm32,-hal_nxp,-hal_infineon,-hal_silabs,-hal_rpi_pico,-hal_altera,-hal_atmel,-hal_ti,-nrf_hw_models,-babblesim,-matter,-openthread,-tflite-micro,-trusted-firmware-m,-sof"
          SMC_VP:               ${{ github.workspace }}/vp/build_smc/bin/smc-vp
          # gcc-toolset libstdc++ must stay on the path: smc-vp was built with
          # GCC 12, and this env block would otherwise replace GITHUB_ENV's
          # toolset LD_LIBRARY_PATH from the Activate step.
          LD_LIBRARY_PATH: ${{ env.SYSTEMC_HOME }}/lib:${{ env.SYSTEMC_HOME }}/lib-linux64:${{ env.CCI_HOME }}/lib:${{ env.BOOST_HOME }}/lib:${{ env.BOOST_HOME }}/lib64:${{ env.OPENSSL3_HOME }}/lib:${{ env.OPENSSL3_HOME }}/lib64:/opt/rh/${{ env.GCC_TOOLSET }}/root/usr/lib64
        run: |
          chmod +x "$SMC_VP"
          test -x "$SMC_VP"
          cd sw/zephyr-smc
          ./zephyr_smc.sh ci
          if [ -d .workspace ]; then
            find .workspace -name .git -type d -prune -exec rm -rf {} + || true
          fi
          df -h

      - name: Upload Zephyr SMC VP logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc-zephyr-logs-rhel8
          path: sw/zephyr-smc/build/*/run.log
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 8 — SMU interconnect unit tests on RHEL 8
# SystemC + CCI only.  Release + ASAN + Coverage as three separate
# run_tests.sh invocations (same split as Ubuntu).
# ─────────────────────────────────────────────────────────────────────────────
  smu-unit-tests-rhel8:
    name: SMU interconnect unit tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            ${{ env.GCC_TOOLSET }}-libasan-devel \
            ${{ env.GCC_TOOLSET }}-libubsan-devel \
            cmake git \
            python3-pip
          pip3 install --quiet gcovr

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Run SMU interconnect tests
        env:
          SYSTEMC_HOME: ${{ env.SYSTEMC_HOME }}
          CCI_HOME:     ${{ env.CCI_HOME }}
        run: |
          cd vp/platform/smu
          ./run_tests.sh
          ./run_tests.sh --asan
          ./run_tests.sh --coverage

# ─────────────────────────────────────────────────────────────────────────────
# Job 9 — build smu-vp and run SMU VP firmware tests on RHEL 8
# Whisper archives must be PIC (libsmc_cluster_smu.so).  OpenSSL 3 is required
# because smu-vp also links the SEP peripheral tree.
# ─────────────────────────────────────────────────────────────────────────────
  smu-vp-rhel8:
    name: SMU VP firmware tests (RHEL 8)
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
      options: --user root
    needs: build-deps-rhel8

    steps:
      - name: Enable EPEL and PowerTools
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools

      - name: Install build dependencies
        run: |
          dnf install -y \
            ${{ env.GCC_TOOLSET }} \
            cmake make git wget which \
            zlib-devel readline-devel

      - name: Activate GCC Toolset 12
        run: |
          source /opt/rh/${{ env.GCC_TOOLSET }}/enable
          echo "PATH=$PATH"                              >> "$GITHUB_ENV"
          echo "CC=$(which gcc)"                         >> "$GITHUB_ENV"
          echo "CXX=$(which g++)"                        >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"    >> "$GITHUB_ENV"

      - name: Install RISC-V toolchain
        run: |
          mkdir -p /home/runner/riscv
          cd /home/runner/riscv
          XPACK="xpack-riscv-none-elf-gcc-${{ env.RISCV_XPACK_VERSION }}-linux-x64"
          wget -q "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${{ env.RISCV_XPACK_VERSION }}/${XPACK}.tar.gz"
          tar zxf "${XPACK}.tar.gz"
          rm -f "${XPACK}.tar.gz"
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name 'xpack-riscv-none-elf-gcc-*' | head -1)
          mv "${EXTRACTED_DIR}" toolchain
          echo "/home/runner/riscv/toolchain/bin" >> "$GITHUB_PATH"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore SystemC cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SYSTEMC_HOME }}
          key: systemc-${{ env.SYSTEMC_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Restore Boost cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_HOME }}
          key: boost-${{ env.BOOST_VERSION }}-rhel8-pic

      - name: Restore CCI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCI_HOME }}
          key: cci-${{ env.CCI_VERSION }}-rhel8-boost${{ env.BOOST_VERSION }}-cxx${{ env.CXX_STD }}-libdir-lib

      - name: Restore OpenSSL 3 cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL3_HOME }}
          key: openssl-${{ env.OPENSSL3_VERSION }}-rhel8-cxx${{ env.CXX_STD }}

      - name: Cache Whisper (PIC)
        id: cache-whisper-pic-rhel8
        uses: actions/cache@v4
        with:
          path: /home/runner/whisper
          key: whisper-${{ env.WHISPER_REV }}-rhel8-cxx${{ env.CXX_STD }}-libs4-pic

      - name: Check Whisper artifacts
        id: whisper-libs-pic-rhel8
        run: |
          complete=true
          for lib in build-$(uname -s)/librvcore.a \
                     virtual_memory/libvirtual_memory.a \
                     pci/libpci.a \
                     third_party/softfloat/build/RISCV-GCC/softfloat.a; do
            if [ ! -f "/home/runner/whisper/${lib}" ]; then
              echo "missing: ${lib}"
              complete=false
            fi
          done
          echo "complete=${complete}" >> "$GITHUB_OUTPUT"

      - name: Build Whisper (-fPIC)
        if: steps.whisper-libs-pic-rhel8.outputs.complete != 'true'
        env:
          BOOST_ROOT: ${{ env.BOOST_HOME }}
        run: |
          mkdir -p /tmp/boost/include
          ln -s "$BOOST_HOME/include/boost" /tmp/boost/include/boost

          if [ -d /home/runner/whisper/.git ]; then
            echo "reusing restored Whisper checkout; building missing artifacts"
          else
            git clone \
              https://github.com/tenstorrent/whisper.git \
              /home/runner/whisper
          fi
          cd /home/runner/whisper
          git checkout ${{ env.WHISPER_REV }}
          printf 'smc_vp_whisper_libs: $(BUILD_DIR)/librvcore.a $(soft_float_lib) $(pci_lib) $(virtual_memory_lib)\n' \
            > /tmp/whisper-smc-libs.mk
          make -f GNUmakefile -f /tmp/whisper-smc-libs.mk \
            MEM_CALLBACKS=1 CXX_STD=c++20 EXTRA_CXXFLAGS=-fPIC \
            BOOST_ROOT=/tmp/boost \
            smc_vp_whisper_libs -j$(nproc)

      - name: Build smu-vp and run SMU VP tests
        env:
          SYSTEMC_HOME:         ${{ env.SYSTEMC_HOME }}
          CCI_HOME:             ${{ env.CCI_HOME }}
          WHISPER_HOME:         /home/runner/whisper
          BOOST_DIR:            ${{ env.BOOST_HOME }}
          BOOST_ROOT:           ${{ env.BOOST_HOME }}
          OPENSSL_ROOT:         ${{ env.OPENSSL3_HOME }}
          OPENSSL_ROOT_DIR:     ${{ env.OPENSSL3_HOME }}
          RISCV_PREFIX:         riscv-none-elf-
          RISCV_TOOLCHAIN_PATH: /home/runner/riscv/toolchain
        run: |
          cmake -S vp -B vp/build_smc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STD }} \
            -DSMC_CXX_STANDARD=${{ env.CXX_STD }}
          cmake --build vp/build_smc --target smu-vp -j$(nproc)
          cd sw/smu-vp-tests
          ./run_smu_vp_tests.sh
