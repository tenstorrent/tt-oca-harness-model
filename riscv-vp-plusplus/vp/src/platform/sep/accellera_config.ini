# Model-specific configurations (isolated, edit these files — not this one)
@include sep_efuse_vp.ini
@include lc_ctrl_vp.ini
[bool]
# Enable/disable GDB remote debugging for the VeeR ISS.
# When true, the ISS will open a GDB server on gdbTcpPort.
och_sep_ss1.gdb : false
# If set to true, VeeR ISS will reset its memory-mapped register backing store on reset deassertion.
och_sep_ss1.rv31imc.resetMemoryMappedRegister : false
# If set to true VeeR ISS NMI will be enabled
och_sep_ss1.rv31imc.enableNmi : true
# Enable instriuction tracing. Possible to trace in cvs format or simple log format - which further can be a gzip file 
och_sep_ss1.trace             : true
# Veer/EL2 git clone - verbose setting
och_sep_ss1.verbose           : true
# Trace ld/st data address if true.
och_sep_ss1.traceLdSt         : true
# Log files in CSV format when tru
och_sep_ss1.csv               : false
# Enable debug triggers when true.
och_sep_ss1.triggers          : true
# Enable performance counters when true.
och_sep_ss1.counters          : true

# Verbosity level configuration
# Setting of log levels are as follows: 
# - To get all logs, Verbosity level should be greater than 10.
# - To get FUNCTION_INFO, ERROR and WARNING logs, set it to 7
# - To get ERROR and WARNING logs set the Verbosity level  to 5.
# - To get only ERROR logs set the Verbosity level to 3.
# Note: Currently all logging is done under "info" and the verbosity level should be set greater than 10
# All the related parameters here need not be consistent
[int]
# No logging in SEPMemory — commented out until logging is added
och_sep_ss1.sram.verbosity : 2
och_sep_ss1.rom.verbosity : 2
och_sep_ss1.itcm.verbosity : 2
och_sep_ss1.dtcm.verbosity : 2
och_sep_ss1.bus.verbosity : 2
och_sep_ss1.csrng.nhwapp : 2
och_sep_ss1.dma.verbosity : 2
och_sep_ss1.uart.uart_inst.verbosity : 1
och_sep_ss1.gpio.verbosity : 1
och_sep_ss1.hmac.verbosity : 1
och_sep_ss1.kmac.verbosity : 2
och_sep_ss1.otbn.verbosity : 2
och_sep_ss1.csrng.verbosity : 2
och_sep_ss1.aes.verbosity : 2
och_sep_ss1.mailbox.verbosity : 2
och_sep_ss1.aon_timer.verbosity : 2
och_sep_ss1.rv31imc.verbosity : 2
och_sep_ss1.spi_controller.verbosity : 2
och_sep_ss1.entropy_src.verbosity : 2
och_sep_ss1.edn.verbosity : 2

[string]
# "otbn_loop" or "p256_ecdsa" is supported for algorithm_type
och_sep_ss1.otbn.algorithm_type : p256_ecdsa
# Target ELF file to be loaded onto to the subsystem core
# Path is relative to the accellera_config.ini file
och_sep_ss1.targets : ../../../../sw/tt-oca-hw-main/dv/sep/tests/hello_world/hello_world.elf
# VeeR ISS JSON configuration file (enables/disables ISA extensions and other ISS features).
# This file must be valid strict JSON.
# Path is relative to the accellera_config.ini file
och_sep_ss1.configFile : veeriss_config.json
# Log of state change after each instruction.
# Enable tracing to given file of executed instructions. Output is compressed (with /usr/bin/gzip) if file name ends with *.gz
och_sep_ss1.traceFile : veer_trace.log
# Instruction frequency file.
och_sep_ss1.instFreqFile : veer_inst_freq.log
# A single register setting is provided as an example
och_sep_ss1.regInits : [x1=0x0]

[uint]
# TCP port for the VeeR ISS GDB server (only used when och_sep_ss1.gdb=true).
och_sep_ss1.gdbTcpPort :  [4000]
och_sep_ss1.uartTcpPort : 8000
# VeeR/EL2 ISS: max instructions executed per batch when no interrupt is pending.
# Larger values improve performance but may increase interrupt latency (MTIP/MSIP/MEIP/NMI).
och_sep_ss1.rv31imc.instrBatchSize : 100
# System-wide TLM global quantum in ns. Controls how often temporally-decoupled models synchronize with SystemC time.
# Larger values generally improve performance but can delay time-based events (e.g. CLINT mtime/mtimecmp).
och_sep_ss1.globalQuantumNs : 10

