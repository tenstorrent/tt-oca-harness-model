#    0         = unset
#
# ARRAY PARAMS (chiplet_uid, sip_pubk, bl1_version, etc.)
#   8 x 32-bit words as JSON array, decimal only (no 0x prefix).
#   e.g.  och_sep_ss1.sep_efuse.chiplet_uid : [1, 2, 3, 4, 5, 6, 7, 8]
# -------------------------------------------------------------------------

