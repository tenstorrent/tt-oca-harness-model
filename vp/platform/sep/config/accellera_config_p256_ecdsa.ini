# SEP VP config for OTBN P-256 ECDSA firmware tests.
# Keeps the platform defaults (cwd / relative paths stay under this directory)
# and overrides only algorithm_type. The shared accellera_config.ini stays on
# otbn_loop so otbn-dv-test (nested loops) is unchanged.
@include accellera_config.ini
[string]
och_sep_ss1.otbn.algorithm_type : p256_ecdsa
