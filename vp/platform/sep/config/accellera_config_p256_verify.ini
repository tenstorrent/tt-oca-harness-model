# Model-specific configurations (isolated, edit these files — not this one)
@include efuse_vp.ini
@include lifecycle_ctrl_vp.ini
[bool]
# Enable/disable GDB remote debugging for the VeeR ISS.
# When true, the ISS will open a GDB server on gdbTcpPort.
och_sep_ss1.gdb : false
# Enable/disable the SIM_OUT bootcode virtual console. When true (default), decodes
# the bootcode's simput* writes to COLD_SCRATCH[2] and prints with a [SIM_OUT] header.
# Set false when an SMC model is present and consuming the register directly.
och_sep_ss1.scratch_cold.sim_out.enable : true
# Enable/disable the SEP_STATUS production-status console. When true (default), decodes
# firmware status words written to COLD_SCRATCH[1] and prints with a [SEP_STATUS] header.
# Set false when an SMC model is present and consuming the status ring instead.
och_sep_ss1.scratch_cold.sep_status.enable : true
# SMC boot straps (latched in the SMC reset unit, read by the boot ROM via init_straps).
# These select which path the SEP ROM takes; defaults give a Secondary chiplet that waits
# for the SMC-staged manifest. Set primary_chiplet=true for Primary (boot from SPI flash).
#   primary_chiplet       STRAPS_LO[25]  true = Primary (SPI boot); false = Secondary (wait SMC)
#   boot_recovery         STRAPS_HI[23]  true = recovery: wait for SMC manifest even if Primary
#   rotate_update         STRAPS_HI[29]  true = use rotated (backup) manifest slot
#   status_report_disable STRAPS_LO[21]  true = skip status-ring init
#   bl0_pll_clk           STRAPS_HI[24]  true = init PLL from fuses; false = use refclk
och_sep_ss1.smc.primary_chiplet       : true
och_sep_ss1.smc.boot_recovery         : false
och_sep_ss1.smc.rotate_update         : false
och_sep_ss1.smc.status_report_disable : false
och_sep_ss1.smc.bl0_pll_clk           : false
# If set to true, VeeR ISS will reset its memory-mapped register backing store on reset deassertion.
och_sep_ss1.rv31imc.resetMemoryMappedRegister : false
# If set to true VeeR ISS NMI will be enabled
och_sep_ss1.rv31imc.enableNmi : true
# Instruction trace. Off unless traceFile below names a log. With no file,
# true sends one line per retired instruction to stdout.
och_sep_ss1.trace             : false
# Veer/EL2 git clone - verbose setting
och_sep_ss1.verbose           : true
# Trace ld/st data address if true.
och_sep_ss1.traceLdSt         : false
# Log files in CSV format when tru
och_sep_ss1.csv               : false
# Enable debug triggers when true.
och_sep_ss1.triggers          : true
# Enable performance counters when true.
och_sep_ss1.counters          : false
# Enable VeeR EL2 fast-PIC vectored external-interrupt entry. Required for
# the el2_pic peripheral model: the ISS reads MEIHAP on M_EXTERNAL and
# jumps to the handler at meivt + (claim_id << 2) instead of mtvec.
och_sep_ss1.fastExt           : true

# Verbosity level configuration
# Setting of log levels are as follows: 
# - To get all logs, Verbosity level should be greater than 10.
# - To get FUNCTION_INFO, ERROR and WARNING logs, set it to 7
# - To get ERROR and WARNING logs set the Verbosity level  to 5.
# - To get only ERROR logs set the Verbosity level to 3.
# Note: Currently all logging is done under "info" and the verbosity level should be set greater than 10
# All the related parameters here need not be consistent
[int]
# No logging in SEPMemory — commented out until logging is added
och_sep_ss1.sram.verbosity : 1
och_sep_ss1.rom.verbosity : 1
och_sep_ss1.itcm.verbosity : 1
och_sep_ss1.dtcm.verbosity : 1
och_sep_ss1.bus.verbosity : 1
och_sep_ss1.csrng.nhwapp : 1
och_sep_ss1.dma.verbosity : 1
och_sep_ss1.hmac.verbosity : 1
och_sep_ss1.kmac.verbosity : 1
och_sep_ss1.otbn.verbosity : 1
och_sep_ss1.csrng.verbosity : 1
och_sep_ss1.aes.verbosity : 1
och_sep_ss1.mailbox.verbosity : 1
och_sep_ss1.aon_timer.verbosity : 1
och_sep_ss1.rv31imc.verbosity : 1
och_sep_ss1.spi_controller.verbosity : 1
och_sep_ss1.entropy_src.verbosity : 1
och_sep_ss1.edn.verbosity : 1
# scratch_cold hosts the SIM_OUT and SEP_STATUS decoders; this gates its CSML
# messages (the decoded console lines themselves always print).
och_sep_ss1.scratch_cold.verbosity : 1

[string]
# "otbn_loop", "smoke" "p256_ecdsa", "rsa_3072", "rsa_2048" is supported for algorithm_type. 
# "otbn_loop" and "smoke" are not actual algorithms they are created so that fw tests can passed
och_sep_ss1.otbn.algorithm_type : p256_ecdsa
# Target ELF file to be loaded onto to the subsystem core
# Path is relative to the accellera_config.ini file
och_sep_ss1.targets : ../../../../sw/sep-vp-tests/fw-tests-from-tt-oca-hw/fw/sep/tests/hello_world/hello_world.elf
# The SEP_STATUS value->name table is no longer a run-time config key: scratch_cold
# compiles in the path to its vendored status_values.tsv (SEP_SCRATCH_COLD_STATUS_VALUES_PATH).
# ROM boot: preload the SPI flash with a Verilog $readmemh-style .spi_preload image
# (manifest + BL1 payload) before simulation starts. Parsed directly into spi_flash's
# backing memory — no .bin conversion needed. Path relative to this ini file.
och_sep_ss1.spiPreload : ../../../../sw/sep-vp-tests/fw-tests-from-tt-oca-hw/fw/sep/bootcode/prebuilt/non_secure_boot.spi_preload
# The same thing for a raw binary image, for fixtures not in the hex format above.
# The value must be quoted, or CCI rejects the config with a JSON parse error:
#   och_sep_ss1.spiBackdoorFile : "data/my_test_flash.bin"
# Both keys are opt-in and spiPreload wins if both are set. Naming neither means the flash
# starts erased (0xFF) — the model never picks up an image the config did not ask for.
# VeeR ISS JSON configuration file (enables/disables ISA extensions and other ISS features).
# This file must be valid strict JSON.
# Path is relative to the accellera_config.ini file
och_sep_ss1.configFile : veeriss_config.json
# Log of state change after each instruction.
# Enable tracing to given file of executed instructions. Output is compressed (with /usr/bin/gzip) if file name ends with *.gz
# One line per retired instruction -- ~11.3 M lines and ~862 MB for a ROM boot.
# Absent means off; set it, or a *.gz name for a compressed trace, to enable.
# och_sep_ss1.traceFile : veer_trace.log
# Instruction frequency file.
#och_sep_ss1.instFreqFile : veer_inst_freq.log
# A single register setting is provided as an example
och_sep_ss1.regInits : [x1=0x0]

[uint]
# TCP port for the VeeR ISS GDB server (only used when och_sep_ss1.gdb=true).
och_sep_ss1.gdbTcpPort :  [4000]
# VeeR/EL2 ISS: max instructions executed per batch when no interrupt is pending.
# Larger values improve performance but may increase interrupt latency (MTIP/MSIP/MEIP/NMI).
och_sep_ss1.rv31imc.instrBatchSize : 100
# Process-wide TLM global quantum in ns (same 1 µs default as SMC / smu-vp).
# Larger values generally improve performance but can delay time-based events.
och_sep_ss1.globalQuantumNs : 1000

# sep_cpu_ctrl — static strap/fuse inputs (set to 1 to unblock firmware boot)
och_sep_ss1.cpu_ctrl.smc_fuse_sense_done : 1
och_sep_ss1.cpu_ctrl.sep_fuse_sense_done : 1
och_sep_ss1.cpu_ctrl.sep_standalone      : 0
och_sep_ss1.cpu_ctrl.fast_spi_en         : 0
och_sep_ss1.cpu_ctrl.fast_iccm_en        : 0
och_sep_ss1.cpu_ctrl.fast_dccm_en        : 0
och_sep_ss1.cpu_ctrl.fast_sram_en        : 0
och_sep_ss1.cpu_ctrl.fast_pka_en         : 0
och_sep_ss1.cpu_ctrl.test_en             : 0
och_sep_ss1.cpu_ctrl.bypass_mem_repair   : 0

