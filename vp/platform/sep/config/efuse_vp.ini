# SEP eFuse VP configuration
# All keys use the full SC hierarchy: och_sep_ss1.sep_efuse.<param>
#
# HOW FUSE STATE IS SET
#   The array comes from a .preload image, the same mechanism and the same files the
#   RTL testbench uses via +sep_preload_efuse. sep_test_template in
#   dv/sep/testlist_sep.yaml loads default_efuse.preload, so that is the default here
#   too and a VP run starts from the same part the RTL does.
#
#   A $readmemh image works too — 256 hex words, word 0 first, @addr origins and //
#   comments allowed — which is the form the harness DV images take. The model detects
#   which of the two it has been given rather than being told.
#
#   The model also accepts per-field parameters (lc_state, locks_lo, chiplet_uid, ...)
#   for standalone peripheral testbenches, but an image and those parameters are
#   alternatives, not a base plus an overlay: when fuse_preload_file is set the image
#   defines the array and the parameters are ignored. Combining them could only mean
#   ORing, since fuses go 0->1, and ORing two encodings of one field corrupts it —
#   LC_STATE is the clearest case, where 0xF0 (TEST_DEV) ORed with the encoding of raw
#   1 gives 0xF1, a code that is not a legal differential encoding at all. To run with
#   different fuses, point at a different image.
#
#   Tests needing an erased part comment out fuse_preload_file, which is this model's
#   equivalent of the +SEP_EFUSE_NO_PRELOAD that the sep_efuse_fw_* tests override
#   their run_flags with. sw/sep-vp-tests/.../vp_test_env.sh derives such a config.
#
# WHAT default_efuse.preload CONTAINS
#   LC_STATE     0xF0  — the differential encoding of raw 0, i.e. TEST_DEV
#   LOCKS_LO/HI  0     — no locks; ROM sets the ones it wants at runtime
#   CLASS_KEY          — 53bda99b 4dbd502a 0eb208a0 54e01f1d
#   CHIPLET_UID  word 0 = 0xdeadbeef, rest 0
#   everything else erased
# -------------------------------------------------------------------------

[int]
och_sep_ss1.sep_efuse.verbosity : 2

[uint]
# Not fuse-backed: in silicon these are token comparator outputs. Presetting them lets
# a test start from a known result without staging a token first; a TOKEN_EOP write
# overwrites them. 21 (0x15) = match, 42 (0x2A) = mismatch, 63 (0x3F) = error, 0 = unset.
och_sep_ss1.sep_efuse.rma_sip_token_match    : 0
och_sep_ss1.sep_efuse.rma_chiplet_token_match: 0
och_sep_ss1.sep_efuse.sec_disable_token_match: 0

[string]
# Relative to this .ini, following the same rule as och_sep_ss1.spiPreload.
och_sep_ss1.sep_efuse.fuse_preload_file : ../../../../sep/peripherals/efuse/config/default_efuse.preload

# Expected SHA-256 digest of the secure-disable token. No fuse holds this: in silicon
# it is the SEP_SEC_DISABLE_TOKEN RTL parameter, built from rev cells for metal ECO,
# and the production value is embedded at synthesis rather than checked in anywhere.
# The model defaults it to zero, as the RTL parameter does, which makes every token
# mismatch; this is the standalone SEP testbench's override
# (top_define.sv SEP_SEC_DIS_TEST_TOKEN_HASH), the SHA-256 of an all-zero token:
#   66687aad f862bd77 6c8fc18b 8e9f8e20 08971485 6ee233b3 902a591d 0d5f2925
# Word 0 is digest bits [31:0], so the words run opposite to that byte order.
och_sep_ss1.sep_efuse.sec_disable_token_digest : [224340261, 2418694429, 1860318131, 144118917, 2392821280, 1821360523, 4167220599, 1718123181]

# Matching the token is necessary but not sufficient: security_disable_o also needs the
# silicon revision to permit the feature, which the prim_rev_cell in
# efuse_security_tokens.sv exists to deny on A2/B1 parts. Defaults true; set false to
# model one of those revisions, where a matching token does nothing.
#   och_sep_ss1.sep_efuse.sec_disable_rev_enable : true

# The test_en strap, latched at fuse sense. Asserting it blocks every fuse command,
# zeroes the secrets the key manager receives, and opens FEAT_CTRL's test section — the
# platform feeds lc_ctrl's secure_tm_i from here, so this is the only place to set it.
# Defaults false, which is what a functional part straps.
#   och_sep_ss1.sep_efuse.secure_tm : false
