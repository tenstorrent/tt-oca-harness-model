# LC Ctrl VP configuration
# FEAT_CTRL is computed at end_of_elaboration from these params — read-only from FW.
# All keys use the full SC hierarchy: och_sep_ss1.lc_ctrl.<param>
#
# NOTE: lc_state below is NOT used on a platform run. sep_lifecycle_ctrl.sv takes the
#       lifecycle state from the eFuse shadow, so och_sep_ss wires it from the eFuse
#       model at start_of_simulation and FEAT_CTRL is computed from the fuse. Change the
#       fuse image in efuse_vp.ini to change the state; the parameter here only applies
#       to a standalone lifecycle_ctrl testbench, where there is no eFuse to ask.
#
#       The eFuse holds the differential code {~raw[3:0], raw[3:0]}, so the raw values
#       tabulated below appear in the fuse as 0xF0 (TEST_DEV), 0xE1 (PROD) and so on.
#       A code that is not a legal encoding — including the 0x00 of an erased part —
#       decodes to INVALID and zeroes FEAT_CTRL.
#
# LC STATE ENCODING (4-bit)
#   0x0  TEST_DEV    — all features enabled
#   0x1  PROD        — func bits only (no debug/test)
#   0x2  RMA_SIP     — all SIP features on
#   0x6  RMA_CHIPLET — all features forced on
#   0x4  INVALID     — FEAT_CTRL = 0 (all features off)
#   0x8  PROD_END    — func bits only
# -------------------------------------------------------------------------

[int]
och_sep_ss1.lc_ctrl.verbosity        : 2
och_sep_ss1.lc_ctrl.lc_state         : 1

[uint]
och_sep_ss1.lc_ctrl.sip_dis_lo       : 0
och_sep_ss1.lc_ctrl.sip_dis_hi       : 0
och_sep_ss1.lc_ctrl.sys_dis_lo       : 0
och_sep_ss1.lc_ctrl.sys_dis_hi       : 0

[bool]
och_sep_ss1.lc_ctrl.security_disable : false
och_sep_ss1.lc_ctrl.secure_tm        : true
