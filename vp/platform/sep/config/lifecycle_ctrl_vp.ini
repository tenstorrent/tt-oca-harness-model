# LC Ctrl VP configuration
# All keys use the full SC hierarchy: och_sep_ss1.lc_ctrl.<param>
#
# MOST OF THIS FILE DOES NOT APPLY TO A PLATFORM RUN. sep_lifecycle_ctrl.sv has no state
# of its own: it takes shadow_regs_i, security_disable_i and secure_tm_i from the eFuse
# wrapper and is combinational on all three. och_sep_ss wires the same inputs from the
# eFuse model and re-applies them whenever the shadow registers change, so FEAT_CTRL
# follows the fuse — including after firmware burns a SiP_DIS or SYS_DIS bit at runtime.
#
# To change what FEAT_CTRL comes out as, change the fuse image in efuse_vp.ini. The
# parameters below only take effect in a standalone lifecycle_ctrl testbench, which has
# no eFuse to ask.
#
#   lc_state         <- eFuse LC_STATE (differentially encoded; see below)
#   sip_dis_lo/hi    <- eFuse SiP_DIS  (woset, software-writable)
#   sys_dis_lo/hi    <- eFuse SYS_DIS  (woset, software-writable)
#   security_disable <- eFuse security_disable_o: the SEC_DISABLE token matching, and the
#                       silicon revision permitting the feature at all
#   secure_tm        <- eFuse secure_tm_o
#
# secure_tm is not a fuse — it is the test_en strap, which sep_efuse_wrapper.sv latches
# when fuse sense completes and fans out to lc_ctrl along with the shadow registers. It
# still comes from the eFuse model on a platform, so the one strap that blocks fuse
# commands and zeroes the key manager's secrets is the one that opens FEAT_CTRL's test
# section [47:32]. Set och_sep_ss1.sep_efuse.secure_tm to model a part strapped for test;
# the key below only applies to a standalone lifecycle_ctrl testbench.
#
# The eFuse holds LC_STATE as the differential code {~raw[3:0], raw[3:0]}, so the raw
# values tabulated below appear in the fuse as 0xF0 (TEST_DEV), 0xE1 (PROD) and so on. A
# code that is not a legal pair — including the 0x00 of an erased part — raises
# lc_sigint_err and zeroes FEAT_CTRL, which is the block's fail-safe against a tampered
# lifecycle state. That is distinct from a legally encoded but unassigned state, which
# also gives FEAT_CTRL = 0 but reports no integrity error.
#
# LC STATE ENCODING (4-bit raw)
#   0x0  TEST_DEV    — all features enabled
#   0x1  PROD        — func bits only (no debug/test)
#   0x2  RMA_SIP     — all SIP features on
#   0x6  RMA_CHIPLET — all features forced on
#   0x4  INVALID     — FEAT_CTRL = 0 (all features off)
#   0x8  PROD_END    — func bits only
# -------------------------------------------------------------------------

[int]
och_sep_ss1.lc_ctrl.verbosity        : 2
och_sep_ss1.lc_ctrl.lc_state         : 1

[uint]
och_sep_ss1.lc_ctrl.sip_dis_lo       : 0
och_sep_ss1.lc_ctrl.sip_dis_hi       : 0
och_sep_ss1.lc_ctrl.sys_dis_lo       : 0
och_sep_ss1.lc_ctrl.sys_dis_hi       : 0

[bool]
och_sep_ss1.lc_ctrl.security_disable : false
och_sep_ss1.lc_ctrl.secure_tm        : false
