# ----------------------------------------------------------------------------------------- #
# SMC-side CCI parameter configuration for the SMU platform (smu-vp)
#
# Usage:  smu-vp smc_smu_vp.ini <smc.elf> <sep-ini> <sep.elf> [sim_time_ms]
#
# Identical semantics to vp/platform/smc/config/smc_platform_vp.ini — the SMC
# platform instance is named "dut" in smu-vp as well, so smc-vp test inis can
# be reused unmodified.  All keys are OPTIONAL (smu-vp applies the same
# defaults as smc-vp before loading this file).
# ----------------------------------------------------------------------------------------- #

[bool]
# Trace every TLM transaction (noisy).  false = info-level only.
dut.trace : false

[int]
# simlog verbosity: >10 = all, 7 = FUNCTION_INFO+ERROR+WARN, 5 = ERROR+WARN, 3 = ERROR only.
dut.log_verbosity : 7

[uint]
# Cluster: four harts (must match smc_platform NUM_HARTS); ELF entry is preset
# programmatically as reset_pc.
dut.cluster.num_harts : 4
dut.cluster.fast_mem_lo : 0x80000000
dut.cluster.fast_mem_hi : 0x90000000
# mmio_lo is lowered to 0x40000000 (vs smc-vp's 0xC0000000) so SMC CPU
# accesses to the SMU global space — the SMC global alias window at
# 0x40000000 and the SEP global aperture at 0x50000000 — route into the
# fabric (and out output_axi to the SMU crossbar) instead of the cluster's
# stubbed data socket.  On-die local addresses are unaffected.
dut.cluster.mmio_lo     : 0x40000000
dut.cluster.mmio_hi     : 0xC1000000
dut.cluster.source_id   : 0x10

# Platform IP sizing (must match the fabric address map).
dut.bootrom.size_bytes        : 0x20000
dut.scratchpad_ram.size_bytes : 0x100000
dut.plic.num_sources          : 336
dut.plic.num_contexts         : 8
dut.clint.num_harts           : 4
dut.reset_unit.num_subsystems : 32

# CPU control + DMA base addresses match the smc-vp fabric routing.
dut.cpu_ctrl.base_addr        : 0xC0400000
dut.dma.base_addr             : 0xC0038000

# Limit DMA master-socket burst size to the width the modeled targets accept.
dut.dma.max_burst_bytes       : 8

# SMU crossbar apertures (must match och_sep_ss1.sep_global_base on the SEP
# side — the integrator programs both, like the RTL CSR contract).
# sep_region_size is 512 MiB so the aperture covers the SEP SRAM alias
# (0x50000000 + 0x1000_0000 = 0x60000000) in addition to the low 16 MiB of
# SEP-local space; the SEP-side inbound remap subtracts the same base.
smu_xbar.sep_global_base : 0x50000000
smu_xbar.sep_region_size : 0x20000000
smu_xbar.smc_global_base : 0x40000000
smu_xbar.smc_region_size : 0x1000000

[string]
# Optional: preload the boot ROM with a hex/bin image (empty = zero-fill).
dut.bootrom.init_file       :
dut.bootrom.init_file_format : auto
