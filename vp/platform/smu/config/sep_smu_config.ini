# ----------------------------------------------------------------------------------------- #
# SEP-side CCI parameter configuration for the SMU platform (smu-vp)
#
# Usage:  smu-vp <smc-ini> <smc-elf> sep_smu_config.ini <sep-elf> [sim_time_ms]
#
# Mirrors vp/platform/sep/config/accellera_config.ini with the deltas the SMU
# integration needs:
#   * instruction/data tracing off (two ISSes running; keep logs manageable)
#   * `targets` is a placeholder — smu-vp always overrides it with the
#     <sep-elf> command-line argument
#   * the smc_global window is switched to forwarding mode by an smu-vp preset
#     (och_sep_ss1.smc_global.forward_en), so no stub seeding happens here
#
# Paths are relative to this file's directory (smu-vp chdir's here, like
# sep-vp does for its own ini).
# ----------------------------------------------------------------------------------------- #

# Model-specific configurations (isolated, edit these files — not this one)
@include ../../sep/config/efuse_vp.ini
@include ../../sep/config/lifecycle_ctrl_vp.ini

[bool]
# Enable/disable GDB remote debugging for the VeeR ISS.
och_sep_ss1.gdb : false
# SIM_OUT bootcode virtual console (writes bootcode simput* status with a
# SIM_OUT header).
och_sep_ss1.sim_out.enable : true
# SEP_STATUS production-status console.  In the SMU configuration the status
# ring lives in the *real* SMC SRAM (the smc_global window forwards there);
# this console only taps the fallback stub, so it never fires here — keep it
# enabled for harmlessness; an SMC-side consumer owns the ring.
och_sep_ss1.sep_status.enable : true
# SMC boot straps — in the SMU configuration these are staged by the SMC
# firmware through the real path, not seeded into a stub.  The values here
# only matter for the fallback stub (unused).
och_sep_ss1.smc.primary_chiplet       : false
och_sep_ss1.smc.boot_recovery         : false
och_sep_ss1.smc.rotate_update         : false
och_sep_ss1.smc.status_report_disable : false
och_sep_ss1.smc.bl0_pll_clk           : false
# If set to true, VeeR ISS will reset its memory-mapped register backing store on reset deassertion.
och_sep_ss1.rv31imc.resetMemoryMappedRegister : false
# If set to true VeeR ISS NMI will be enabled
och_sep_ss1.rv31imc.enableNmi : true
# Instruction tracing — off in the SMU configuration (two ISSes running).
och_sep_ss1.trace             : false
och_sep_ss1.verbose           : false
och_sep_ss1.traceLdSt         : false
och_sep_ss1.csv               : false
och_sep_ss1.triggers          : true
och_sep_ss1.counters          : false

[int]
# Verbosity level configuration (see accellera_config.ini for the scale).
och_sep_ss1.sram.verbosity : 1
och_sep_ss1.rom.verbosity : 1
och_sep_ss1.itcm.verbosity : 1
och_sep_ss1.dtcm.verbosity : 1
och_sep_ss1.bus.verbosity : 1
och_sep_ss1.csrng.nhwapp : 1
och_sep_ss1.dma.verbosity : 1
och_sep_ss1.uart.uart_inst.verbosity : 1
och_sep_ss1.gpio.verbosity : 1
och_sep_ss1.hmac.verbosity : 1
och_sep_ss1.kmac.verbosity : 1
och_sep_ss1.otbn.verbosity : 1
och_sep_ss1.csrng.verbosity : 1
och_sep_ss1.aes.verbosity : 1
och_sep_ss1.mailbox.verbosity : 1
och_sep_ss1.aon_timer.verbosity : 1
och_sep_ss1.rv31imc.verbosity : 1
och_sep_ss1.spi_controller.verbosity : 1
och_sep_ss1.entropy_src.verbosity : 1
och_sep_ss1.edn.verbosity : 1
och_sep_ss1.sim_out.verbosity : 2
och_sep_ss1.sep_status.verbosity : 2

[string]
och_sep_ss1.otbn.algorithm_type : rsa_3072
# Target ELF placeholder — smu-vp always overrides this with its <sep-elf>
# command-line argument.
och_sep_ss1.targets : ../../../../sw/tt-oca-hw-main/dv/sep/tests/hello_world/hello_world.elf
# SEP_STATUS value->name table (fallback-stub console only; see above).
och_sep_ss1.sep_status.names_tsv : ../../../../sw/tt-oca-hw-main/meta/status/status_values.tsv
# VeeR ISS JSON configuration file.
och_sep_ss1.configFile : ../../sep/config/veeriss_config.json
# Instruction trace file (tracing disabled above).
och_sep_ss1.traceFile : veer_trace.log
och_sep_ss1.regInits : [x1=0x0]

[uint]
och_sep_ss1.gdbTcpPort :  [4000]
och_sep_ss1.uartTcpPort : 8000
och_sep_ss1.rv31imc.instrBatchSize : 100
# System-wide TLM global quantum in ns.
och_sep_ss1.globalQuantumNs : 10
