# ----------------------------------------------------------------------------------------- #
# smc-vp CCI parameter configuration
#
# Usage:  smc-vp smc_platform_vp.ini <firmware.elf> [sim_time_ms]
#
# Keys are full hierarchical CCI names with the platform instance prefix
# "dut." (set in main.cpp).  Sections select the value type, matching the
# accellera_config.ini convention used by sep-vp:
#   [bool] [int] [uint] [string]
#
# All keys here are OPTIONAL — main.cpp applies sensible defaults before
# loading this file, so anything set below overrides a default.
# ----------------------------------------------------------------------------------------- #

[bool]
# Trace every TLM transaction (noisy).  false = info-level only.
dut.trace : false

[int]
# simlog verbosity: >10 = all, 7 = FUNCTION_INFO+ERROR+WARN, 5 = ERROR+WARN, 3 = ERROR only.
dut.log_verbosity : 7

[uint]
# Cluster: four harts (must match smc_platform NUM_HARTS); ELF entry is preset
# programmatically as reset_pc.
dut.cluster.num_harts : 4
dut.cluster.fast_mem_lo : 0x80000000
dut.cluster.fast_mem_hi : 0x90000000
dut.cluster.mmio_lo     : 0xC0000000
dut.cluster.mmio_hi     : 0xC1000000
dut.cluster.source_id   : 0x10

# Platform IP sizing (must match the fabric address map).
dut.bootrom.size_bytes        : 0x20000
dut.scratchpad_ram.size_bytes : 0x100000
dut.plic.num_sources          : 336
dut.plic.num_contexts         : 8
dut.clint.num_harts           : 4
dut.reset_unit.num_subsystems : 32

# CPU control base address matches the smc-vp fabric routing.
dut.cpu_ctrl.base_addr        : 0xC0400000

[string]
# Optional: preload the boot ROM with a hex/bin image (empty = zero-fill).
dut.bootrom.init_file       :
dut.bootrom.init_file_format : auto
