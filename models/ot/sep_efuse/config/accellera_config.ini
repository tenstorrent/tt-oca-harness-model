# SEP_EFUSE parameter configuration
# Format: key: value  (one per line)
# instance_prefix sets the SC hierarchy prefix for short (no-dot) keys
#
# ─────────────────────────────────────────────────────────────────────────────
# ARRAY PARAMS (chiplet_uid, sip_pubk, rma_sip_token, etc.)
#   Arrays are 8 × 32-bit words stored as JSON arrays, e.g.:
#     chiplet_uid: [w0, w1, w2, w3, w4, w5, w6, w7]
#   Place them in the [string] section. Decimal values only (no 0x prefix).
#
# TOKEN MATCH ENCODING (rma_sip_token_match etc.)
#   0x15 (21 decimal)  = match
#   0x2A (42 decimal)  = mismatch
#   0x3F (63 decimal)  = error
#   0                  = unset (no comparison yet)
#
# ─────────────────────────────────────────────────────────────────────────────
# COMBO 1 — Default boot (Tests 1-8 pass)
#   lc_state: 1           # DEV state
#   status_rpt: 1         # sense-done asserted
#   chiplet_uid: [2684354560, 2684354561, 2684354562, 2684354563, 2684354564, 2684354565, 2684354566, 2684354567]
#   sip_pubk:    [2952790016, 2952790017, 2952790018, 2952790019, 2952790020, 2952790021, 2952790022, 2952790023]
#   bl1_version: [3221225472, 3221225473, 3221225474, 3221225475, 3221225476, 3221225477, 3221225478, 3221225479]
#
# COMBO 2 — PROD state
#   lc_state: 1
#
# COMBO 3 — TEST_DEV (all-zero fuses, minimal config)
#   lc_state: 0
#
# COMBO 4 — RMA_SIP state
#   lc_state: 2    # or 3 (4'b001x)
#   sip_dis_lo: 0
#   sip_dis_hi: 0
#
# COMBO 5 — RMA_CHIPLET state (all features forced on)
#   lc_state: 6    # or 7 (4'b011x)
#
# COMBO 6 — PROD_END state
#   lc_state: 8
#
# COMBO 7 — Token match preset (simulate post-SHA256 result)
#   rma_sip_token_match:     21    # 0x15 = match
#   rma_chiplet_token_match: 42    # 0x2A = mismatch
#   sec_disable_token_match: 21    # 0x15 = match
#
# COMBO 8 — SIP/SYS feature disable with RMA_SIP
#   lc_state: 2
#   sip_dis_lo: 255   # 0xFF — disable lower 8 SIP features
#   sip_dis_hi: 0
#
# ─────────────────────────────────────────────────────────────────────────────

[string]
instance_prefix: testbench.sep_efuse_dut
chiplet_uid: [2684354560, 2684354561, 2684354562, 2684354563, 2684354564, 2684354565, 2684354566, 2684354567]
sip_pubk:    [2952790016, 2952790017, 2952790018, 2952790019, 2952790020, 2952790021, 2952790022, 2952790023]
bl1_version: [3221225472, 3221225473, 3221225474, 3221225475, 3221225476, 3221225477, 3221225478, 3221225479]

[int]
verbosity: 2

[uint]
lc_state: 1
sboot_dis: 0
transient_rma_en: 0
sip_dis_lo: 0
sip_dis_hi: 0
sys_dis_lo: 0
sys_dis_hi: 0
chiplet_pubk_revoke: 0
status_rpt: 1
sep_rom_ctrl: 0
sep_spi_ctrl_field_en: 0
spi_discovery_ctrl: 0
spi_phy_dq_timing: 0
spi_phy_dqs_timing: 0
spi_phy_gate_lpbk: 0
spi_phy_dll_slave: 0
spi_phy_dll_master: 0
spi_phy_misc: 0
spi_rb_valid_time: 0
rma_sip_token_match: 0
rma_chiplet_token_match: 0
sec_disable_token_match: 0
