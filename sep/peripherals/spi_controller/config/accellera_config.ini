# SPI Controller parameter configuration
# Format: key: value  (one per line)
# Sections: [int], [double], [bool], [string]
# instance_prefix sets the SC hierarchy prefix for short (no-dot) keys

# --- DUT parameters ---
[string]
instance_prefix: testbench.spi_controller_dut

[int]
verbosity: 2
NumCS: 2
TxDepth: 72
RxDepth: 64
CmdDepth: 4

[double]
ClkPeriodNs: 10.0
# Temporal decoupling on (0 would disable the quantum keeper entirely). The
# standalone testbench is the only consumer of this file -- sep-vp uses
# vp/platform/sep/config/accellera_config.ini -- and every shipped preset in
# config/spi_controller_*.json also runs with a non-zero quantum, so exercising
# the model with the keeper active matches how it is actually integrated.
TimeKeeperQuantumNs: 100.0

[bool]
ByteOrder: true

# --- Testbench mirror parameters (must match DUT values above) ---
[int]
testbench.TxDepth: 72
testbench.RxDepth: 64

[bool]
testbench.ByteOrder: true
