# SPI Controller parameter configuration
# Format: key: value  (one per line)
# Sections: [int], [double], [bool], [string]
# instance_prefix sets the SC hierarchy prefix for short (no-dot) keys

# --- DUT parameters ---
[string]
instance_prefix: testbench.spi_controller_dut

[int]
verbosity: 2
NumCS: 2
TxDepth: 72
RxDepth: 64
CmdDepth: 4

[double]
ClkPeriodNs: 10.0
TimeKeeperQuantumNs: 0.0

[bool]
ByteOrder: true

# --- Testbench mirror parameters (must match DUT values above) ---
[int]
testbench.TxDepth: 72
testbench.RxDepth: 64

[bool]
testbench.ByteOrder: true
