# KMAC parameter configuration
# Format: key: value  (one per line)
# Sections: [int], [double], [bool], [string]
# instance_prefix sets the SC hierarchy prefix for short (no-dot) keys

[string]
instance_prefix: kmac_testbench.kmac_dut

[int]
