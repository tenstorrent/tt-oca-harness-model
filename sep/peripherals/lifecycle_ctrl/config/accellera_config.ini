# LC_CTRL parameter configuration
# Format: key: value  (one per line)
# instance_prefix sets the SC hierarchy prefix for short (no-dot) keys
#
# ─────────────────────────────────────────────────────────────────────────────
# LC STATE ENCODING (lc_state, 4-bit)
#   0x0  TEST_DEV   — all features enabled; Tests 1-3, 5-7, 10 active
#   0x1  PROD       — func-bits only (no debug/test); Test 4 active
#   0x2  RMA_SIP    — all SIP features enabled (~sip_dis)
#   0x6  RMA_CHIPLET— all features forced on; Test 9 active
#   0x4  INVALID    — FEAT_CTRL=0 (all features off); Test 8 active (also 0x5)
#   0x8  PROD_END   — func-bits only, same as PROD base
#
# ─────────────────────────────────────────────────────────────────────────────
# COMBO 1 — Default / TEST_DEV (runs Tests 1-3, 5-7, 10)
#   lc_state: 0
#   sip_dis_lo: 0
#   sip_dis_hi: 0
#   sys_dis_lo: 0
#   sys_dis_hi: 0
#   security_disable: false
#   secure_tm: true
#
# COMBO 2 — TEST_DEV, secure_tm=false (runs Test 10 for false branch)
#   lc_state: 0
#   secure_tm: false
#
# COMBO 3 — PROD state, no demote (runs Test 4)
#   lc_state: 1
#
# COMBO 4 — INVALID state (runs Test 8)
#   lc_state: 4      # or 5
#
# COMBO 5 — RMA_CHIPLET state (runs Test 9)
#   lc_state: 6      # or 7
#
# COMBO 6 — PROD_END state
#   lc_state: 8
#
# COMBO 7 — RMA_SIP state, with SIP feature disable bits set
#   lc_state: 2
#   sip_dis_lo: 0x000000FF   # disable lower 8 SIP features
#   sip_dis_hi: 0
#
# COMBO 8 — security_disable override (forces FEAT_CTRL=all-ones regardless of lc_state)
#   lc_state: 1
#   security_disable: true
#
# ─────────────────────────────────────────────────────────────────────────────
# The combos above only affect Tests 1-12, which read FEAT_CTRL as the configuration
# leaves it and skip when the state does not match. Tests 13-19 drive the input bundle
# through set_inputs() the way the eFuse model does on a platform, so they cover every
# state arm, the lc_sigint_err fail-safe and the demote encoding in a single run,
# whatever is set here.
# ─────────────────────────────────────────────────────────────────────────────

[string]
# Must match the DUT's hierarchical name, or every key below is silently ignored and
# the model's own defaults apply instead.
instance_prefix: testbench.lifecycle_ctrl_dut

[int]
verbosity: 2
lc_state: 0

[uint]
sip_dis_lo: 0
sip_dis_hi: 0
sys_dis_lo: 0
sys_dis_hi: 0

[bool]
security_disable: false
secure_tm: true
