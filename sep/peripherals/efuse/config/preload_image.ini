# SEP_EFUSE — fuse image applied at elaboration.
#
# fuse_preload_file is consumed in end_of_elaboration, before any bus write, so
# it needs a run of its own the way the secure_tm strap does. The testbench sees
# a non-empty fuse_preload_file and runs only the image checks.
#
# The path is relative: the model resolves a relative fuse_preload_file against
# SEP_VP_INI_DIR, which run_tests.sh, the ctest target, and the coverage target
# all point at this directory.
#
# The image and the parameters below disagree on purpose — the test asserts the
# image wins. LC_STATE raw 0 would encode 0xF0, and status_rpt 7 is not 0x11.

[string]
instance_prefix: testbench.efuse_dut
fuse_preload_file: elaboration_image.preload

[int]
verbosity: 2

[uint]
lc_state: 0
status_rpt: 7
