# SEP_EFUSE — secure test mode strap asserted.
#
# secure_tm is latched at reset, so it cannot be flipped from inside a run that
# started without it. The testbench sees this parameter and runs only the
# secure-mode checks. Driven by run_tests.sh, the ctest target, and the
# coverage target so all three phases exercise the same configuration.

[string]
instance_prefix: testbench.efuse_dut
chiplet_uid: [2684354560, 2684354561, 2684354562, 2684354563, 2684354564, 2684354565, 2684354566, 2684354567]

[int]
verbosity: 2

[bool]
secure_tm: true
