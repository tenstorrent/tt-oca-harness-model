# SEP_CPU_CTRL parameter configuration
# Format: key: value  (one per line)
# Sections: [int], [uint], [bool], [string]
# instance_prefix sets the SC hierarchy prefix for short (no-dot) keys
#
# Hardware strap / fuse-sense parameters (set before sc_start; applied in end_of_elaboration):
#   smc_fuse_sense_done  — set to 1 to simulate SMC fuse sense complete
#   sep_fuse_sense_done  — set to 1 to simulate SEP fuse sense complete
#   sep_standalone       — set to 1 for standalone (no host) mode
#   fast_spi_en          — set to 1 to enable fast SPI strap
#   fast_iccm_en         — set to 1 to enable fast ICCM strap
#   fast_dccm_en         — set to 1 to enable fast DCCM strap
#   fast_sram_en         — set to 1 to enable fast SRAM strap
#   fast_pka_en          — set to 1 to enable fast PKA strap
#   test_en              — set to 1 to enable test mode strap
#   bypass_mem_repair    — set to 1 to bypass memory repair

[string]
instance_prefix: tb.dut

[uint]
smc_fuse_sense_done: 0
sep_fuse_sense_done: 0
sep_standalone: 0
fast_spi_en: 0
fast_iccm_en: 0
fast_dccm_en: 0
fast_sram_en: 0
fast_pka_en: 0
test_en: 0
bypass_mem_repair: 0
